[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braim_floorplan_generator"
version = "0.1.0"
description = "Automatic apartment floorplan generator with IFC/SVG/JSON export and IDS validation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kirill Shashchenko", email = "kirill.shashchenko@example.com"}
]
keywords = ["BIM", "IFC", "IDS", "floorplan", "architecture", "ergonomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "archit-app[ifc]>=0.1.0",
    "ifcopenshell>=0.7.0",
    "ifctester>=0.7.0",
    "click>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
braim-fg = "braim_floorplan_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
